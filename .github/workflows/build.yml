name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Localiza o projeto: se a raiz do repo já tem settings.gradle(.kts), usa a raiz.
      # Senão, pega o primeiro .zip do repositório, descompacta e procura o settings.gradle(.kts).
      - name: Locate project (unzip if needed)
        run: |
          set -e
          WS="$GITHUB_WORKSPACE"
          if [ -f "$WS/settings.gradle.kts" ] || [ -f "$WS/settings.gradle" ]; then
            ROOT="$WS"
            echo "Projeto encontrado na raiz do repositório."
          else
            ZIP=$(find "$WS" -type f -iname '*.zip' -not -path '*/.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::Nenhum settings.gradle(.kts) na raiz e nenhum .zip encontrado no repositório."
              exit 1
            fi
            echo "Descompactando: $ZIP"
            mkdir -p "$WS/_project"
            unzip -q -o "$ZIP" -d "$WS/_project"
            SETTINGS=$(find "$WS/_project" -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::O zip não contém settings.gradle(.kts)."
              exit 1
            fi
            ROOT=$(dirname "$SETTINGS")
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Raiz do projeto: $ROOT"
          ls -la "$ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME). Só aceitamos as licenças.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Gera o wrapper (gradlew + jar) se não existir no projeto.
      - name: Ensure Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK was really produced
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -n "$APK"
          test -s "$APK"
          ls -l "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile2dstudio-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore
          
