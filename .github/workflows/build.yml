name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME). Só aceitamos as licenças
      # para o Gradle poder baixar plataformas/build-tools que faltarem.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # O wrapper (gradlew + gradle-wrapper.jar) é binário e pode não estar commitado.
      # Se faltar, é gerado aqui com a mesma versão do Gradle; depois o build usa ./gradlew.
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK was really produced
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -n "$APK"
          test -s "$APK"
          ls -l "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile2dstudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload generated Gradle wrapper (commit these files)
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          if-no-files-found: ignore
          
